name: Build & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Package extension (.vsix)
        run: npm run package -- --out gitlinediff.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v6
        with:
          name: gitlinediff-vsix
          path: gitlinediff.vsix
          if-no-files-found: error

      # Patch-bumps package.json, publishes to the Marketplace, then syncs the
      # version back to main. Skips when the push is the version sync itself.
      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          npx vsce publish
          git add package.json package-lock.json
          git commit -m "chore: bump extension version"
          git push
